[package]
name = "brain-tools"
edition.workspace = true
version.workspace = true

[features]
default = ["native"]
native = ["dep:tokio", "dep:glob", "dep:regex", "dep:walkdir", "dep:portable-pty", "dep:vt100"]
acp = ["dep:agent-client-protocol", "dep:tokio"]

[dependencies]
agent-client-protocol = { workspace = true, optional = true }
brain-types = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

# Native driver deps (feature-gated)
tokio = { workspace = true, features = ["fs", "process", "sync", "time"], optional = true }
glob = { version = "0.3", optional = true }
regex = { version = "1", optional = true }
walkdir = { version = "2", optional = true }
portable-pty = { workspace = true, optional = true }
vt100 = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"
