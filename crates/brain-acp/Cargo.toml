[package]
name = "brain-acp"
edition.workspace = true
version.workspace = true

[features]
default = [
    "unstable_session_close",
    "unstable_session_fork",
    "unstable_session_model",
    "unstable_session_resume",
]
unstable_session_close = ["agent-client-protocol/unstable_session_close"]
unstable_session_fork = ["agent-client-protocol/unstable_session_fork"]
unstable_session_model = ["agent-client-protocol/unstable_session_model"]
unstable_session_resume = ["agent-client-protocol/unstable_session_resume"]

[dependencies]
agent-client-protocol = { workspace = true }
async-trait = "0.1"
chrono = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["compat"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }
