[package]
name = "brain-core"
edition.workspace = true
version.workspace = true

[features]
default = []
mistralrs = ["brain-providers/mistralrs"]
llamacpp = ["brain-providers/llamacpp"]

[dependencies]
brain-types = { workspace = true }
brain-providers = { workspace = true }
brain-stores = { workspace = true }
brain-tools = { workspace = true }
brain-loops = { workspace = true }
brain-transports = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-stream = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
async-stream = { workspace = true }
