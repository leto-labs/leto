[package]
name = "brain-cli"
edition.workspace = true
version.workspace = true

[[bin]]
name = "brain"
path = "src/main.rs"

[features]
default = ["openai-oauth"]
openai-oauth = ["brain-core/openai-oauth", "brain-acp/openai-oauth"]
mistralrs = ["brain-core/mistralrs", "brain-acp/mistralrs"]
llamacpp = ["brain-core/llamacpp", "brain-acp/llamacpp"]

[dependencies]
atif = { workspace = true }
brain-core = { workspace = true }
brain-acp = { workspace = true }
brain-config = { workspace = true }
brain-stores = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
