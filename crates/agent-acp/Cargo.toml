[package]
name = "agent-acp"
edition.workspace = true
version.workspace = true

[features]
default = [
    "unstable_session_close",
    "unstable_session_fork",
    "unstable_session_model",
    "unstable_session_resume",
]
unstable_session_close = ["agent-client-protocol/unstable_session_close"]
unstable_session_fork = ["agent-client-protocol/unstable_session_fork"]
unstable_session_model = ["agent-client-protocol/unstable_session_model"]
unstable_session_resume = ["agent-client-protocol/unstable_session_resume"]

[[bin]]
name = "agent-acp"
path = "src/bin/agent-acp.rs"

[[bin]]
name = "agent-acp-mock"
path = "src/bin/agent-acp-mock.rs"

[dependencies]
agent-client-protocol = { workspace = true }
agent-core = { workspace = true }
agent-runtime = { workspace = true }
agent-store = { workspace = true }
async-trait = "0.1"
anyhow = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
provider-openai = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "sync", "time", "rt-multi-thread", "macros"] }
tokio-util = { workspace = true, features = ["compat"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true }
provider = { workspace = true }
