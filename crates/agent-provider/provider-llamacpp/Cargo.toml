[package]
name = "provider-llamacpp"
edition.workspace = true
version.workspace = true

[features]
default = []
llamacpp = ["dep:llama-cpp-2", "dep:encoding_rs", "dep:hf-hub", "dep:tokio", "dep:reqwest", "dep:image"]

[dependencies]
provider = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
llama-cpp-2 = { workspace = true, optional = true, features = ["mtmd"] }
encoding_rs = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "rt"], optional = true }
reqwest = { workspace = true, optional = true }
image = { workspace = true, optional = true }
futures = { workspace = true }
async-stream = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
