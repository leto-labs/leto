[package]
name = "brain-providers"
edition.workspace = true
version.workspace = true

[features]
default = ["openai"]
openai = ["dep:reqwest", "dep:eventsource-stream"]
openai-oauth = ["dep:reqwest", "dep:eventsource-stream", "dep:sha2", "dep:base64", "dep:rand", "dep:form_urlencoded"]
mistralrs = ["dep:mistralrs"]
llamacpp = ["dep:llama-cpp-2", "dep:encoding_rs", "dep:hf-hub"]

[dependencies]
brain-types = { workspace = true }
ulid = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
tokio = { workspace = true, features = ["time", "sync", "net", "io-util", "fs"] }
serde = { workspace = true }
serde_json = { workspace = true }

# Optional: OpenAI provider
reqwest = { workspace = true, optional = true }
eventsource-stream = { workspace = true, optional = true }

# Optional: OAuth
sha2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
form_urlencoded = { workspace = true, optional = true }
chrono = { workspace = true }
tracing = { workspace = true }

# Optional: mistral.rs provider
mistralrs = { workspace = true, optional = true }

# Optional: llama.cpp provider
llama-cpp-2 = { workspace = true, optional = true }
encoding_rs = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }

[dev-dependencies]
brain-stores = { path = "../brain-stores" }
dotenvy = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
