[package]
name = "agent-server"
edition.workspace = true
version.workspace = true

[dependencies]
agent-core = { workspace = true }
agent-core-remote = { path = "../agent-core-remote", default-features = false }
agent-runtime = { workspace = true }
agent-store = { workspace = true }
aide = { workspace = true, features = ["axum", "axum-json", "axum-query", "macros"] }
atif = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
chrono = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
provider = { workspace = true }
provider-openai = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "net"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
agent-store = { workspace = true }
provider = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }
