[workspace]
resolver = "2"
members = [
    "crates/chat",
    "crates/chat-slack",
    "crates/chat-teams",
    "crates/chat-telegram",
    "crates/atif",
    "crates/agent-provider/provider",
    "crates/agent-tool/tool",
    "crates/agent-tool/tool-files",
    "crates/agent-tool/tool-process",
    "crates/agent-tool/tool-web",
    "crates/agent-runtime",
    "crates/agent-loops",
    "crates/agent-store",
    "crates/agent-core",
    "crates/agent-core-remote",
    "crates/agent-server",
    "crates/agent-acp",
    "crates/agent-cli",
    "crates/agent-provider/provider-anthropic",
    "crates/agent-provider/provider-llamacpp",
    "crates/agent-provider/provider-mistralrs",
    "crates/agent-provider/provider-openai",
    "tools/provider-preset-gen",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# Async
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"
agent-client-protocol = "0.10.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
aide = "0.16.0-alpha.3"
image = "0.25"

# IDs
ulid = { version = "1", features = ["serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Errors
thiserror = "2"
anyhow = "1"

# HTTP / SSE
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
eventsource-stream = "0.2"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

# Crypto / OAuth
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
form_urlencoded = "1"

# Directories
dirs = "6"

# Testing
tempfile = "3"
portable-pty = "0.9.0"
vt100 = "0.16.2"

# Env
dotenvy = "0.15"

# Local inference
mistralrs = { version = "0.7", default-features = false }
llama-cpp-2 = { version = "0.1", default-features = false }
encoding_rs = "0.8"
hf-hub = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Internal
atif = { path = "crates/atif" }
chat = { path = "crates/chat" }
chat-slack = { path = "crates/chat-slack" }
chat-teams = { path = "crates/chat-teams" }
chat-telegram = { path = "crates/chat-telegram" }
provider = { path = "crates/agent-provider/provider" }
agent-tool = { path = "crates/agent-tool/tool" }
agent-tool-files = { path = "crates/agent-tool/tool-files" }
agent-tool-process = { path = "crates/agent-tool/tool-process" }
agent-tool-web = { path = "crates/agent-tool/tool-web" }
agent-runtime = { path = "crates/agent-runtime" }
agent-loops = { path = "crates/agent-loops" }
agent-store = { path = "crates/agent-store" }
agent-core = { path = "crates/agent-core" }
agent-core-remote = { path = "crates/agent-core-remote" }
agent-server = { path = "crates/agent-server" }
agent-acp = { path = "crates/agent-acp" }
agent-cli = { path = "crates/agent-cli" }
provider-anthropic = { path = "crates/agent-provider/provider-anthropic" }
provider-llamacpp = { path = "crates/agent-provider/provider-llamacpp" }
provider-mistralrs = { path = "crates/agent-provider/provider-mistralrs" }
provider-openai = { path = "crates/agent-provider/provider-openai" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
