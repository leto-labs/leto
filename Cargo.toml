[workspace]
resolver = "2"
members = [
    "crates/atif",
    "crates/brain-types",
    "crates/brain-providers",
    "crates/brain-stores",
    "crates/brain-loops",
    "crates/brain-tools",
    "crates/brain-transports",
    "crates/brain-core",
    "crates/brain-acp",
    "crates/brain-cli",
    "crates/brain-config",
    "tools/provider-preset-gen",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# Async
tokio = { version = "1", default-features = false }
tokio-util = "0.7"
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"
agent-client-protocol = "0.10.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# IDs
ulid = { version = "1", features = ["serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Errors
thiserror = "2"
anyhow = "1"

# HTTP / SSE
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
eventsource-stream = "0.2"
toml = "0.8"

# Crypto / OAuth
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
form_urlencoded = "1"

# Directories
dirs = "6"

# Testing
tempfile = "3"
portable-pty = "0.9.0"
vt100 = "0.16.2"

# Env
dotenvy = "0.15"

# Local inference
mistralrs = { version = "0.7", default-features = false }
llama-cpp-2 = { version = "0.1", default-features = false }
encoding_rs = "0.8"
hf-hub = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Internal
atif = { path = "crates/atif" }
brain-types = { path = "crates/brain-types" }
brain-providers = { path = "crates/brain-providers" }
brain-stores = { path = "crates/brain-stores" }
brain-loops = { path = "crates/brain-loops" }
brain-transports = { path = "crates/brain-transports" }
brain-tools = { path = "crates/brain-tools" }
brain-core = { path = "crates/brain-core" }
brain-acp = { path = "crates/brain-acp" }
brain-config = { path = "crates/brain-config" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
